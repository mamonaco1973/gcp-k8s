<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="Requests from the internet reach the network load balancer created for the NGINX ingress controller's service in the flask-gke cluster, a zonal GKE cluster in us-central1-a with private nodes behind Cloud NAT. The ingress routes /flask-app/api to the Flask pods on the default-node-pool (e2-standard-4, one to four nodes, autoscaled) and /games paths to the Tetris, Frogger and Breakout pods on the single-node game-node-pool. The Flask pods use the firestore-access-sa Kubernetes service account, bound through Workload Identity to a Google service account with roles/datastore.user, to read and write Firestore. Both pools pull images from Artifact Registry."><defs><marker id="a_e_http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_lb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_flask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_games" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_scale" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_cp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_ddb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_pullf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker><marker id="a_e_pullg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475467"/></marker></defs><rect width="1620" height="790" fill="#ffffff"/><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_http)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">HTTP</text><path d="M810.0,350 V435" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_lb)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">to ingress pods</text><path d="M600,495.0 H465" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_flask)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">flask-app</text><path d="M1020,495.0 H1155" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_games)"/><text x="1090.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">games</text><path d="M250.0,350 V435" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_scale)"/><text x="264.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">firestore-access-sa</text><path d="M1370.0,350 V435" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_cp)"/><text x="1384.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">schedules</text><path d="M250.0,550 V635" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_ddb)"/><text x="264.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">read / write</text><path d="M690.0,640 V595.0 H370.0 V555" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_pullf)"/><text x="384.0" y="615.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">pull</text><path d="M930.0,640 V595.0 H1370.0 V555" fill="none" stroke="#475467" stroke-width="2" marker-end="url(#a_e_pullg)"/><text x="1384.0" y="615.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#475467" stroke="#ffffff" stroke-width="6" paint-order="stroke">pull</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#f6f8fa" stroke="#475467" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#475467" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g>